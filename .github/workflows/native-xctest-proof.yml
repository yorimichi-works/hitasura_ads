name: Prove native XCTest screenshots

on:
  push:
    branches:
      - codex/app-store-readiness-20261002

jobs:
  native-xctest-proof:
    if: github.repository == 'yorimichi-works/hitasura_ads' && github.ref == 'refs/heads/codex/app-store-readiness-20261002' && github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-xctest]')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check native screenshot transport and isolation guards
        run: |
          python3 -m unittest discover -s tool/store_assets/tests -p test_native_screenshot_driver.py -v
          python3 -m unittest discover -s tool/store_assets/tests -p 'test_xctest*.py' -v
          python3 -m unittest discover -s tool/store_assets/tests -p test_capture_session.py -v
      - name: Download exact frozen09d simulator harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reuse_download build/store_assets/native_ios
          python3 - <<'PYTHON'
          import json, pathlib, shutil, subprocess
          expected = {
              'repository': 'yorimichi-works/hitasura_ads',
              'source_sha': '09d43a790390251c93ee76564c6ce800bdf5f93f',
              'run_id': 37068852657,
              'artifact_id': 11253354721,
              'zip_sha256': '51e27abec176bc6caadfab5521b9b061aff0b16283bb1f096123182bd253c104',
          }
          descriptor = pathlib.Path('build/reuse_download/descriptor.json')
          descriptor.write_text(json.dumps(expected, indent=2))
          shutil.copyfile(descriptor, 'build/store_assets/native_ios/expected_artifact.json')
          base = f"repos/{expected['repository']}/actions/artifacts/{expected['artifact_id']}"
          for endpoint, name in [(base, 'metadata.json'), (base + '/zip', 'artifact.zip')]:
              with pathlib.Path('build/reuse_download', name).open('wb') as output:
                  subprocess.run(['gh', 'api', endpoint], stdout=output, check=True, timeout=120)
              if name == 'metadata.json':
                  shutil.copyfile('build/reuse_download/metadata.json', 'build/store_assets/native_ios/download_metadata.json')
          PYTHON
      - name: Verify unchanged frozen app and native bridge
        run: |
          python3 tool/store_assets/reuse_capture_harness.py --descriptor build/reuse_download/descriptor.json --metadata build/reuse_download/metadata.json --zip build/reuse_download/artifact.zip
          python3 tool/store_assets/verify_native_bridge.py --app build/reused_native_harness/Runner.app > build/store_assets/native_ios/native_bridge_check.json
          python3 tool/release/verify_localized_display_names.py --app build/reused_native_harness/Runner.app > build/store_assets/native_ios/localized-display-names.json
      - name: Compile only the separate screenshot test driver
        timeout-minutes: 3
        run: |
          xcodebuild -version
          xcodebuild build-for-testing -project tool/store_assets/NativeScreenshotUITests.xcodeproj -scheme NativeScreenshotUITests -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/native_screenshot_ui CODE_SIGNING_ALLOWED=NO
      - name: Capture one real prepared Japanese phone home via XCTest
        timeout-minutes: 10
        run: |
          xctestrun=$(python3 -c "import pathlib; files=list(pathlib.Path('build/native_screenshot_ui/Build/Products').glob('*.xctestrun')); assert len(files)==1; print(files[0])")
          python3 -u tool/store_assets/capture_ios_simulator.py --app build/reused_native_harness/Runner.app --app-source-sha 09d43a790390251c93ee76564c6ce800bdf5f93f --locales ja --devices iphone_6_9 --scenes home --session-loop --runtime-version 18.6 --work-deadline-seconds 480 --natural-status-bar --screenshot-xctestrun "$xctestrun" --screenshot-driver-sha "$GITHUB_SHA"
      - name: Retain the exact native screenshot and diagnostic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-xctest-ja-phone-attempt${{ github.run_attempt }}
          path: build/store_assets/native_ios
          if-no-files-found: warn
          retention-days: 7
