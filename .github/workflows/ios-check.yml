name: iOS simulator build

on:
  push:
    branches:
      - codex/ios-purchase-build
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub --reporter expanded
      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign --dart-define=ADMOB_MODE=test
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ads-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
