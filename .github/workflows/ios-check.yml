name: iOS simulator build

on:
  push:
    branches:
      - codex/ios-purchase-build
      - codex/app-store-readiness-20261002
  workflow_dispatch:

jobs:
  ios:
    # A reuse-only probe must independently verify that no compiled source changed.
    if: github.ref != 'refs/heads/codex/app-store-readiness-20261002' || (!contains(github.event.head_commit.message, '[capture-reuse]') && !contains(github.event.head_commit.message, '[ump-qa]') && !contains(github.event.head_commit.message, '[ump-reuse]'))
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      capture_artifact_id: ${{ steps.capture_harness.outputs.artifact-id }}
      capture_artifact_digest: ${{ steps.capture_harness.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode for native capture
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        run: |
          # Latest stable Xcode on the documented macos-15 image (2026-10-02).
          # Its default remains 16.4, which must not drive iOS 26 simulators.
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: |
          flutter test --no-pub --reporter expanded
          python3 -m unittest discover -s tool/store_assets/tests -v
          python3 -m unittest discover -s tool/release/tests -v
      - name: Build iOS simulator app
        run: |
          set +e
          flutter build ios --simulator --debug --no-codesign --dart-define=ADMOB_MODE=test > ios-build.log 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            tail -n 8 ios-build.log
            ps -Ao pid,etime,%cpu,command | grep -E '[x]codebuild|[s]wift-frontend|[d]art' | tail -n 8 || true
          done
          wait "$build_pid"
          result=$?
          tail -n 120 ios-build.log
          exit "$result"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ads-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
      - name: Build native capture harness
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        run: flutter build ios --simulator --debug --no-codesign -t tool/store_assets/native_capture_main.dart --dart-define=ADMOB_MODE=disabled
      - name: Verify native capture bridge is compiled
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        run: python3 tool/store_assets/verify_native_bridge.py
      - name: Package native capture harness
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        run: |
          # A tar archive preserves executable bits for a later diagnostic run.
          tar -czf build/hitasura-native-capture-harness.tar.gz -C build/ios/iphonesimulator Runner.app
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('build/native-capture-provenance.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'],
              'target': 'tool/store_assets/native_capture_main.dart',
              'mode': 'debug_ios_simulator',
              'admob_mode': 'disabled',
              'app_store_archive': False,
          }, indent=2))
          PY
      - name: Retain native capture harness
        id: capture_harness
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-capture-harness
          path: |
            build/hitasura-native-capture-harness.tar.gz
            build/native-capture-provenance.json
          retention-days: 7
          compression-level: 0
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log


  native-smoke:
    needs: ios
    if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: [iphone_6_9, ipad_13]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test capture and release guards
        run: |
          python3 -m unittest discover -s tool/store_assets/tests -v
          python3 -m unittest discover -s tool/release/tests -v
      - name: Download and pin this run's compiled harness
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ needs.ios.outputs.capture_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.ios.outputs.capture_artifact_digest }}
        run: |
          mkdir -p build/reuse_download build/store_assets/native_ios
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil, subprocess, importlib.util
          spec = importlib.util.spec_from_file_location('reuse', 'tool/store_assets/reuse_capture_harness.py')
          reuse = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reuse)
          expected = reuse.descriptor({
              'repository': 'yorimichi-works/hitasura_ads',
              'source_sha': os.environ['GITHUB_SHA'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'artifact_id': int(os.environ['EXPECTED_ARTIFACT_ID']),
              'zip_sha256': os.environ['EXPECTED_ARTIFACT_DIGEST'].removeprefix('sha256:'),
          })
          pathlib.Path('build/reuse_download/descriptor.json').write_text(json.dumps(expected, indent=2))
          shutil.copyfile('build/reuse_download/descriptor.json', 'build/store_assets/native_ios/expected_artifact.json')
          base = f"repos/yorimichi-works/hitasura_ads/actions/artifacts/{expected['artifact_id']}"
          for endpoint, name in [(base, 'metadata.json'), (base + '/zip', 'artifact.zip')]:
              with pathlib.Path('build/reuse_download', name).open('wb') as output:
                  subprocess.run(['gh', 'api', endpoint], stdout=output, check=True, timeout=120)
              if name == 'metadata.json':
                  shutil.copyfile('build/reuse_download/metadata.json', 'build/store_assets/native_ios/download_metadata.json')
          PYTHON
      - name: Verify exact native artifact and compiled source
        run: |
          python3 tool/store_assets/reuse_capture_harness.py --descriptor build/reuse_download/descriptor.json --metadata build/reuse_download/metadata.json --zip build/reuse_download/artifact.zip
          python3 tool/store_assets/verify_native_bridge.py --app build/reused_native_harness/Runner.app > build/store_assets/native_ios/native_bridge_check.json
      - name: Capture Japanese and Arabic native validation chunk
        timeout-minutes: 10
        env:
          CAPTURE_DEVICE: ${{ matrix.device }}
        run: |
          xcodebuild -version
          python3 -u tool/store_assets/capture_ios_simulator.py --app build/reused_native_harness/Runner.app --app-source-sha "$GITHUB_SHA" --locales ja,ar --devices "$CAPTURE_DEVICE" --session-loop --work-deadline-seconds 480 --natural-status-bar --videos
      - name: Upload native checkpoints and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-smoke-${{ matrix.device }}
          path: build/store_assets/native_ios
          if-no-files-found: warn
          retention-days: 7

  native-probe:
    if: github.repository == 'yorimichi-works/hitasura_ads' && github.ref == 'refs/heads/codex/app-store-readiness-20261002' && github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-reuse]')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test capture and release guards
        run: |
          python3 -m unittest discover -s tool/store_assets/tests -v
          python3 -m unittest discover -s tool/release/tests -v
      - name: Download pinned retained simulator harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reuse_download build/store_assets/native_ios
          python3 - <<'PYTHON'
          import json, subprocess, pathlib, shutil, importlib.util
          spec = importlib.util.spec_from_file_location('reuse', 'tool/store_assets/reuse_capture_harness.py')
          reuse = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reuse)
          descriptor_path = pathlib.Path('tool/store_assets/native_capture_artifact.json')
          expected = reuse.descriptor(json.loads(descriptor_path.read_text()))
          shutil.copyfile(descriptor_path, 'build/store_assets/native_ios/expected_artifact.json')
          base = f"repos/{expected['repository']}/actions/artifacts/{expected['artifact_id']}"
          for endpoint, name in [(base, 'metadata.json'), (base + '/zip', 'artifact.zip')]:
              with pathlib.Path('build/reuse_download', name).open('wb') as output:
                  subprocess.run(['gh', 'api', endpoint], stdout=output, check=True, timeout=120)
              if name == 'metadata.json':
                  shutil.copyfile('build/reuse_download/metadata.json', 'build/store_assets/native_ios/download_metadata.json')
          PYTHON
      - name: Verify exact retained source and native bridge
        run: |
          python3 tool/store_assets/reuse_capture_harness.py --descriptor tool/store_assets/native_capture_artifact.json --metadata build/reuse_download/metadata.json --zip build/reuse_download/artifact.zip
          python3 tool/store_assets/verify_native_bridge.py --app build/reused_native_harness/Runner.app > build/store_assets/native_ios/native_bridge_check.json
      - name: Capture genuine English iPad purchase settings
        timeout-minutes: 10
        run: |
          xcodebuild -version
          APP_SOURCE_SHA=$(python3 -c "import json; print(json.load(open('tool/store_assets/native_capture_artifact.json'))['source_sha'])")
          python3 -u tool/store_assets/capture_ios_simulator.py --app build/reused_native_harness/Runner.app --app-source-sha "$APP_SOURCE_SHA" --locales en --devices ipad_13 --scenes home --session-loop --include-settings --work-deadline-seconds 480 --natural-status-bar
      - name: Upload native checkpoints and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-iap-en-ipad
          path: build/store_assets/native_ios
          if-no-files-found: warn
          retention-days: 7

  native-media-recovery:
    needs: native-probe
    if: github.repository == 'yorimichi-works/hitasura_ads' && github.ref == 'refs/heads/codex/app-store-readiness-20261002' && github.event_name == 'push' && contains(github.event.head_commit.message, '[capture-reuse]')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test capture and release guards
        run: |
          python3 -m unittest discover -s tool/store_assets/tests -v
          python3 -m unittest discover -s tool/release/tests -v
      - name: Download pinned retained simulator harness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/reuse_download build/store_assets/native_ios
          python3 - <<'PYTHON'
          import json, subprocess, pathlib, shutil, importlib.util
          spec = importlib.util.spec_from_file_location('reuse', 'tool/store_assets/reuse_capture_harness.py')
          reuse = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reuse)
          descriptor_path = pathlib.Path('tool/store_assets/native_capture_artifact.json')
          expected = reuse.descriptor(json.loads(descriptor_path.read_text()))
          shutil.copyfile(descriptor_path, 'build/store_assets/native_ios/expected_artifact.json')
          base = f"repos/{expected['repository']}/actions/artifacts/{expected['artifact_id']}"
          for endpoint, name in [(base, 'metadata.json'), (base + '/zip', 'artifact.zip')]:
              with pathlib.Path('build/reuse_download', name).open('wb') as output:
                  subprocess.run(['gh', 'api', endpoint], stdout=output, check=True, timeout=120)
              if name == 'metadata.json':
                  shutil.copyfile('build/reuse_download/metadata.json', 'build/store_assets/native_ios/download_metadata.json')
          PYTHON
      - name: Verify exact retained source and native bridge
        run: |
          python3 tool/store_assets/reuse_capture_harness.py --descriptor tool/store_assets/native_capture_artifact.json --metadata build/reuse_download/metadata.json --zip build/reuse_download/artifact.zip
          python3 tool/store_assets/verify_native_bridge.py --app build/reused_native_harness/Runner.app > build/store_assets/native_ios/native_bridge_check.json
      - name: Recover Japanese and Arabic iPad media
        timeout-minutes: 10
        run: |
          xcodebuild -version
          APP_SOURCE_SHA=$(python3 -c "import json; print(json.load(open('tool/store_assets/native_capture_artifact.json'))['source_sha'])")
          python3 -u tool/store_assets/capture_ios_simulator.py --app build/reused_native_harness/Runner.app --app-source-sha "$APP_SOURCE_SHA" --locales ja,ar --devices ipad_13 --session-loop --videos --work-deadline-seconds 480 --natural-status-bar
      - name: Upload native checkpoints and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-recovery-ja-ar-ipad
          path: build/store_assets/native_ios
          if-no-files-found: warn
          retention-days: 7

  ump-qa-build:
    if: github.repository == 'yorimichi-works/hitasura_ads' && github.ref == 'refs/heads/codex/app-store-readiness-20261002' && github.event_name == 'push' && contains(github.event.head_commit.message, '[ump-qa]')
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    outputs:
      artifact_id: ${{ steps.ump_harness.outputs.artifact-id }}
      tar_sha256: ${{ steps.ump_package.outputs.tar_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check isolated UMP QA guards
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          flutter pub get
          flutter test --no-pub test/ump_qa_test.dart
          flutter analyze --no-pub tool/ump_qa test/ump_qa_test.dart
          python3 -m unittest discover -s tool/ump_qa -p 'test_*.py' -v
      - name: Compile standalone simulator UI-test driver
        timeout-minutes: 10
        run: xcodebuild build-for-testing -project tool/ump_qa/UmpQaUITests.xcodeproj -scheme UmpQaUITests -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ump_qa_ui CODE_SIGNING_ALLOWED=NO
      - name: Build guarded actual-UMP target without ads
        timeout-minutes: 20
        run: |
          flutter build ios --simulator --debug --no-codesign -t tool/ump_qa/ump_qa_main.dart --dart-define=HITASURA_UMP_QA=true --dart-define=ADMOB_MODE=disabled
          python3 tool/ump_qa/prepare_simulator_app.py
      - name: Pin same-run unsigned UMP QA products
        id: ump_package
        run: |
          digest=$(python3 tool/ump_qa/archive_qa_build.py pack --source-sha "$GITHUB_SHA")
          echo "tar_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain unsigned UMP QA products
        id: ump_harness
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ump-qa-harness
          path: build/ump-qa-build.tar.gz
          retention-days: 7
          compression-level: 0

  ump-qa-native:
    needs: ump-qa-build
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.ump-qa-build.outputs.artifact_id }}
          path: build/ump_qa_download
          merge-multiple: true
      - name: Verify same-run UMP QA source and binary digest
        env:
          EXPECTED_TAR_SHA256: ${{ needs.ump-qa-build.outputs.tar_sha256 }}
        run: |
          python3 tool/ump_qa/archive_qa_build.py unpack --archive build/ump_qa_download/ump-qa-build.tar.gz --source-sha "$GITHUB_SHA" --sha256 "$EXPECTED_TAR_SHA256" > build/ump_qa_xctestrun.txt
      - name: Check actual accept, refuse and privacy options without ads
        timeout-minutes: 14
        run: |
          xctestrun=$(cat build/ump_qa_xctestrun.txt)
          python3 -u tool/ump_qa/run_native_qa.py --app build/ump_qa_reused/qa_app/Runner.app --xctestrun "$xctestrun" --source-sha "$GITHUB_SHA"
      - name: Retain actual UMP native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ump-native-evidence
          path: build/ump_qa_evidence
          if-no-files-found: warn
          retention-days: 7

  ump-qa-reuse:
    if: github.repository == 'yorimichi-works/hitasura_ads' && github.ref == 'refs/heads/codex/app-store-readiness-20261002' && github.event_name == 'push' && contains(github.event.head_commit.message, '[ump-reuse]')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check UMP reuse and runtime guards
        run: python3 -m unittest discover -s tool/ump_qa -p 'test_*.py' -v
      - name: Download exact retained unsigned UMP QA products
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, subprocess
          descriptor = json.loads(pathlib.Path('tool/ump_qa/retained_build.json').read_text())
          out = pathlib.Path('build/ump_qa_reuse_download')
          out.mkdir(parents=True, exist_ok=False)
          base = f"repos/yorimichi-works/hitasura_ads/actions/artifacts/{descriptor['artifact_id']}"
          for endpoint, name in [(base, 'metadata.json'), (base + '/zip', 'artifact.zip')]:
              with (out / name).open('wb') as stream:
                  subprocess.run(['gh', 'api', endpoint], stdout=stream, check=True, timeout=120)
          PYTHON
      - name: Verify retained UMP identity, hashes and unchanged consent dependencies
        run: python3 tool/ump_qa/reuse_qa_build.py --metadata build/ump_qa_reuse_download/metadata.json --zip build/ump_qa_reuse_download/artifact.zip > build/ump_qa_xctestrun.txt
      - name: Test real consent on the confirmed installed compatible runtime
        timeout-minutes: 14
        run: |
          xctestrun=$(cat build/ump_qa_xctestrun.txt)
          python3 -u tool/ump_qa/run_native_qa.py --app build/ump_qa_retained/verified/qa_app/Runner.app --xctestrun "$xctestrun" --source-sha 95977f83a70e1c4818d44f25f2260fc54809160e --runtime-version 18.6
      - name: Retain UMP reuse and real-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ump-reused-native-evidence
          path: |
            build/ump_qa_evidence
            build/ump_qa_retained/verified_reuse.json
            build/ump_qa_reuse_download/metadata.json
          if-no-files-found: warn
          retention-days: 7
