name: iOS simulator build

on:
  push:
    branches:
      - codex/ios-purchase-build
      - codex/app-store-readiness-20261002
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub --reporter expanded
      - name: Build iOS simulator app
        run: |
          set +e
          flutter build ios --simulator --debug --no-codesign --dart-define=ADMOB_MODE=test > ios-build.log 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            sleep 60
            tail -n 8 ios-build.log
            ps -Ao pid,etime,%cpu,command | grep -E '[x]codebuild|[s]wift-frontend|[d]art' | tail -n 8 || true
          done
          wait "$build_pid"
          result=$?
          tail -n 120 ios-build.log
          exit "$result"
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-ads-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
      - name: Build native capture harness
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        run: flutter build ios --simulator --debug --no-codesign -t tool/store_assets/native_capture_main.dart --dart-define=ADMOB_MODE=disabled
      - name: Capture localized native smoke assets
        if: github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        timeout-minutes: 20
        run: python3 tool/store_assets/capture_ios_simulator.py --locales en,ja,ar --videos
      - name: Upload native capture evidence
        if: always() && github.ref == 'refs/heads/codex/app-store-readiness-20261002'
        uses: actions/upload-artifact@v4
        with:
          name: hitasura-native-localized-store-captures
          path: build/store_assets/native_ios
          if-no-files-found: warn
          retention-days: 30
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
